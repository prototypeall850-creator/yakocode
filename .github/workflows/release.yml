name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upload hasil build ke release tag ini (harus sudah ada)'
        required: true
        default: 'v0.1.0'

jobs:
  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-linux-android
            os: ubuntu-latest
            use-ndk: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      BUILD_CMD: cargo
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Use cross for build
        if: matrix.use-cross
        shell: bash
        run: echo "BUILD_CMD=cross" >> $GITHUB_ENV

      - name: Setup Android NDK
        if: matrix.use-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false

      - name: Configure Android linker
        if: matrix.use-ndk
        shell: bash
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android28-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android28-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$NDK_BIN/aarch64-linux-android28-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> $GITHUB_ENV

      - name: Build
        shell: bash
        run: $BUILD_CMD build --locked --release --target=${{ matrix.target }}

      - name: Package
        shell: bash
        id: package
        env:
          target: ${{ matrix.target }}
        run: |
          set -euxo pipefail
          bin=yakocode
          dist_dir=`pwd`/dist
          name=$bin-${{ env.TAG }}-$target
          executable=target/$target/release/$bin
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable=$executable.exe
          fi
          mkdir -p $dist_dir/$name
          cp $executable $dist_dir/$name/
          cp README.md LICENSE-MIT LICENSE-APACHE config.example.yaml $dist_dir/$name/
          cd $dist_dir
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a $name.zip $name
            echo "archive=dist/$name.zip" >> $GITHUB_OUTPUT
          else
            tar -czf $name.tar.gz $name
            echo "archive=dist/$name.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          files: ${{ steps.package.outputs.archive }}
